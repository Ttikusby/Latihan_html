
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Mahasiswa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            padding: 12px;
            background-color: #79c5d6;
        }

        .form-data {
            background-color: white;
            padding: 25px 50px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            font-size: 26px;
            font-weight: normal;
            margin: 0 0 12px;
        }

        .data {
            font-size: 26px;
            padding: 4px 0 18px;
            border-bottom: 4px solid #ddd;
            margin-bottom: 16px;
        }

        .data:last-child {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-data">
            <h2>Nama</h2>
            <div class="data" id="nama"></div>

            <h2>NIM</h2>
            <div class="data" id="nim"></div>
        </div>
    </div>

    <script>
        let nama = prompt("Masukkan nama kamu:");
        let nim = prompt("Masukkan NIM kamu:");

        document.getElementById("nama").textContent = nama || "";
        document.getElementById("nim").textContent = nim || "";
    </script>

</body>
</html>
