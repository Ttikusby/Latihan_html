<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sapa Menggunakan AJAX dan PHP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 42px 34px 36px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-bottom: 34px;
            text-align: center;
            font-size: 25px;
            line-height: 1.35;
            font-weight: 700;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d7dce1;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        button {
            display: block;
            margin: 18px auto 24px;
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            background: #0d6efd;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0b5ed7;
        }

        button:disabled {
            background: #8bb8f8;
            cursor: not-allowed;
        }

        h2 {
            margin-bottom: 18px;
            text-align: center;
            font-size: 19px;
        }

        #response {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 14px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            background: #f8f9fa;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #response.success {
            border-color: #8fd19e;
            background: #e6ffed;
            color: #246b36;
        }

        #response.error {
            border-color: #f1aeb5;
            background: #fce8ea;
            color: #a52834;
        }

        #response.loading {
            border-color: #b6d4fe;
            background: #e7f1ff;
            color: #084298;
        }

        @media (max-width: 480px) {
            .container {
                padding: 34px 24px 28px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Form Sapa Menggunakan AJAX dan PHP</h1>

        <form id="greetingForm">
            <label for="nama">Masukkan Nama Anda:</label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Contoh: Alex"
                autocomplete="name"
            >
            <button type="submit" id="submitButton">Kirim</button>
        </form>

        <h2>Respon Server:</h2>
        <div id="response" role="status" aria-live="polite">
            Menunggu input...
        </div>
    </main>

    <script>
        const form = document.getElementById("greetingForm");
        const namaInput = document.getElementById("nama");
        const responseArea = document.getElementById("response");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const nama = namaInput.value.trim();

            responseArea.className = "";
            if (nama === "") {
                responseArea.textContent = "Input nama tidak boleh kosong!";
                responseArea.classList.add("error");
                namaInput.focus();
                return;
            }

            const formData = new FormData();
            formData.append("nama", nama);

            submitButton.disabled = true;
            submitButton.textContent = "Mengirim...";
            responseArea.textContent = "Menghubungkan ke server...";
            responseArea.classList.add("loading");

            try {
                const response = await fetch("server.php", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Server memberikan respons yang tidak berhasil.");
                }

                const result = await response.text();
                responseArea.textContent = result;
                responseArea.className = "success";
            } catch (error) {
                responseArea.textContent =
                    "Terjadi kesalahan saat menghubungi server. Pastikan Apache aktif dan halaman dibuka melalui localhost.";
                responseArea.className = "error";
                console.error(error);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Kirim";
            }
        });
    </script>
</body>
</html>
