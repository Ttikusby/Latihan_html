<!DOCTYPE html>
<html>
<head>
    <title>Tabel</title>
</head>

<body>

<table border="1" bordercolor="white" cellspacing="0" cellpadding="0">

    <!-- BARIS 1 -->
    <tr>
        <!-- Kolom 1: biru full 7 baris -->
        <td bgcolor="blue" rowspan="7" width="80" height="85"></td>

        <!-- Kolom 2-4: biru -->
        <td bgcolor="blue" colspan="3" width="255" height="85"></td>

        <!-- Kolom 5: putih -->
        <td width="85"></td>
    </tr>

    <!-- BARIS 2 -->
    <tr>
        <!-- Kolom 2 -->
        <td bgcolor="lime" width="85" height="85"></td>

        <!-- Kolom 3-4 -->
        <td bgcolor="lime" colspan="2" rowspan="2" width="170"></td>

        <!-- Kolom 5 -->
        <td bgcolor="blue" rowspan="2" width="85"></td>
    </tr>

    <!-- BARIS 3 -->
    <tr>
        <!-- Kolom 2: putih -->
        <td width="85" height="85"></td>
    </tr>

    <!-- BARIS 4 -->
    <tr>
        <!-- Kolom 2: biru -->
        <td bgcolor="blue" width="85" height="85"></td>

        <!-- Kolom 3: putih -->
        <td width="85"></td>

        <!-- Kolom 4: biru -->
        <td bgcolor="blue" width="85"></td>

        <!-- Kolom 5: putih -->
        <td width="85"></td>
    </tr>

    <!-- BARIS 5 -->
    <tr>
        <td colspan="4" height="85"></td>
    </tr>

    <!-- BARIS 6 -->
    <tr>
        <td colspan="4" height="85"></td>
    </tr>

    <!-- BARIS 7 -->
    <tr>
        <td colspan="4" height="85"></td>
    </tr>

</table>

</body>
</html>
